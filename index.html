<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 문서 정리기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background: #f5f6f8; color: #333; }
        h2 { text-align: center; margin-bottom: 20px; color: #1a73e8; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; height: calc(100vh - 100px); }
        .box { flex: 1; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; }
        h3 { margin-top: 0; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        textarea { flex: 1; resize: none; border: 1px solid #ddd; border-radius: 4px; padding: 12px; font-size: 14px; line-height: 1.6; }
        .file-input-wrapper { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        input[type="file"] { display: none; }
        .btn { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; text-align: center; }
        .btn:hover { background: #1557b0; }
        .btn-file { background: #5f6368; }
        .btn-file:hover { background: #45494e; }
        #output-box { white-space: pre-wrap; word-break: break-all; overflow-y: auto; background: #fafafa; border: 1px solid #ddd; }
        .loading { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <h2>📑 AI 파일 정리 스튜디오</h2>

    <div class="container">
        <!-- 왼쪽: 파일 업로드 및 원문 입력 -->
        <div class="box">
            <h3>📂 원문 입력 / 파일 업로드</h3>
            <div class="file-input-wrapper">
                <label class="btn btn-file" for="file-upload">📄 텍스트 파일 선택</label>
                <input type="file" id="file-upload" accept=".txt,.csv,.md" onchange="loadFile(this)">
                <span id="file-name" style="color: #666; font-size: 14px;">선택된 파일 없음</span>
            </div>
            <textarea id="input-text" placeholder="여기에 텍스트를 직접 붙여넣거나 위의 버튼으로 파일을 올리세요..."></textarea>
            <button class="btn" style="margin-top: 15px;" onclick="sendToAI()">✨ AI 정리 시작</button>
        </div>

        <!-- 오른쪽: AI 정리본 출력 -->
        <div class="box">
            <h3>📝 AI 핵심 정리본</h3>
            <div id="output-box" class="textarea">여기에 AI의 정리 결과가 출력됩니다.</div>
        </div>
    </div>

    <script>
        // 사용자가 파일을 선택하면 텍스트를 읽어와서 왼쪽 입력창에 넣어주는 함수
        function loadFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            document.getElementById('file-name').innerText = file.name;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('input-text').value = e.target.result;
            };
            reader.readAsText(file, 'UTF-8');
        }

        // Vercel 서버(/api/chat)로 데이터를 보내 정리본을 받아오는 함수
        async function sendToAI() {
            const textContent = document.getElementById('input-text').value;
            const outputBox = document.getElementById('output-box');
            
            if (!textContent.trim()) {
                alert('정리할 내용을 입력하거나 파일을 올려주세요.');
                return;
            }

            outputBox.innerHTML = '<span class="loading">AI가 문서를 읽고 핵심 내용을 정리하는 중입니다... 잠시만 기다려주세요.</span>';

            // AI에게 전달할 명확한 정리 명령 지침을 원문과 함께 묶어줍니다.
            const finalPrompt = `다음 문서의 내용을 핵심만 한눈에 보기 좋게 요약하고 정리해줘:\n\n${textContent}`;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt })
                });
                
                const data = await response.json();
                
                if (data.reply) {
                    outputBox.innerText = data.reply;
                } else {
                    outputBox.innerText = '응답을 받았으나 정리된 내용이 없습니다.';
                }
            } catch (error) {
                outputBox.innerHTML = '<span style="color:red;">오류가 발생했습니다. Vercel 환경 변수(API 키) 설정을 확인해 보세요.</span>';
            }
        }
    </script>
</body>
</html>
